[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "navi-research-pipeline"
version = "0.1.0"
description = "Local, reproducible NAVI-Orbital-style VLM research pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
inference = ["torch>=2.6,<3", "transformers>=4.51,<5", "accelerate>=1.5,<2", "sentencepiece>=0.2,<1"]
quantization = ["bitsandbytes>=0.45,<1"]
lora = ["peft>=0.15,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
navi = "navi_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/navi_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
